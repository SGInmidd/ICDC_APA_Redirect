<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open FileMaker APA Permit</title>

  <script>
    (function () {
      // Get the value from the URL parameter (?apaid=APA2024-002)
      const params = new URLSearchParams(window.location.search);
      const apaID = params.get('apaid');

      if (!apaID) {
        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('status').textContent = "❌ No Project ID provided in URL.";
        });
        return;
      }

      // Build the FileMaker URL using the Project ID
      const target = `FMP://fms.inghamdrains.org/APA?script=Find_APA_Permit&param=${encodeURIComponent(apaID)}&$variablename=APA_Project_ID`;

      // Attempt to redirect to FileMaker
      try {
        window.location.replace(target);
      } catch (e) {
        window.location.href = target;
      }

      // Automatically close the tab after 3 seconds
      setTimeout(function () {
        window.open('', '_self');
        window.close();
      }, 3000);

      // Update fallback link for manual click
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('link').href = target;
        document.getElementById('status').textContent = `Opening APA Project ID: ${apaID}...`;
      });
    })();
  </script>
</head>
<body>
  <p id="status">Opening FileMaker...</p>
  <p>If nothing opens automatically, <a id="link" href="#">click here to open FileMaker manually</a>.</p>
</body>
</html>
