<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open FileMaker Record</title>

  <script>
    (function() {
      // Get the URL parameter value (e.g., ?record=12345)
      const params = new URLSearchParams(window.location.search);
      const recordID = params.get('record');

      // If no parameter is found, just show a message
      if (!recordID) {
        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('status').textContent = "No record ID provided.";
        });
        return;
      }

      // Build your FileMaker URL — customize the script or layout as needed
      const target = `FMP://fms.inghamdrains.org/APA?script=OpenRecord&param=${encodeURIComponent(recordID)}`;

      // Try redirecting to FileMaker
      try {
        window.location.replace(target);
      } catch (e) {
        window.location.href = target;
      }

      // Close the tab after 3 seconds
      setTimeout(function() {
        window.open('', '_self');
        window.close();
      }, 3000);

      // Update the fallback link on the page
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('link').href = target;
        document.getElementById('status').textContent = `Opening record ${recordID}...`;
      });
    })();
  </script>
</head>
<body>
  <p id="status">Opening FileMaker...</p>
  <p>If nothing opens automatically, <a id="link" href="#">click here to open FileMaker</a>.</p>
</body>
</html>
