<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Open APA Project</title>
  <script>
    // Parse the project ID from the URL (e.g., ?id=12345)
    function getProjectId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function openFileMaker(projectId) {
      if (!projectId) {
        document.getElementById('status').innerText = '❌ No Project ID provided.';
        return;
      }

      // Replace with your FileMaker URL pattern
      const fmUrl = `fmp://%7B%7D/APA%20Projects?script=Open_Project&param=${projectId}`;

      // Try opening FileMaker
      window.location.href = fmUrl;

      document.getElementById('status').innerText = `🔗 Opening Project ID: ${projectId}`;
    }

    window.onload = () => {
      const projectId = getProjectId();
      openFileMaker(projectId);
    };
  </script>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
    #status { font-size: 1.2rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>APA Project Link</h1>
  <div id="status">⏳ Loading...</div>
</body>
</html>
