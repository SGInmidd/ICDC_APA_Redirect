<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open FileMaker</title>

  <script>
    (function(){
      var target = "FMP://fms.inghamdrains.org/APA";

      // Try opening the FileMaker link
      try {
        window.location.replace(target);
      } catch(e) {
        window.location.href = target;
      }

      // Wait 3 seconds and then try to close the tab
      setTimeout(function() {
        // Some browsers will only allow this if the page was opened by script
        window.open('', '_self');
        window.close();
      }, 3000); // 3000 ms = 3 seconds
    })();
  </script>
</head>
<body>
  <p>If nothing opens automatically, <a href="FMP://fms.inghamdrains.org/APA">click here to open FileMaker</a>.</p>
  <p>This page will close automatically after a few seconds.</p>
</body>
</html>
